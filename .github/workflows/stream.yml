name: TikTok Zen Live Experimental Cloud Streamer

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Thời lượng stream phiên này (phút, tối đa 300 phút = 5 tiếng)'
        required: true
        default: '60'
      auto_restart:
        description: 'Tự động kích hoạt phiên tiếp theo khi phiên này kết thúc thành công? (true/false)'
        required: true
        default: 'false'

permissions:
  actions: write
  contents: read

# Đảm bảo chỉ có DUY NHẤT 1 phiên stream chạy tại một thời điểm (Tránh xung đột Stream Key)
concurrency:
  group: tiktok-live-session
  cancel-in-progress: false

jobs:
  cloud_stream:
    name: Thử Nghiệm Phát Sóng Chánh Điện Lên TikTok
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Giới hạn tối đa của GitHub Actions

    steps:
      - name: 📥 Tải Mã Nguồn Repository
        uses: actions/checkout@v4

      - name: ⚙️ Cài Đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Cài Đặt Thư Viện Node.js
        run: npm install

      - name: 🖥️ Cài Đặt Xvfb, PulseAudio & FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb pulseaudio ffmpeg dbus-x11

      - name: 🚀 Khởi Động Stream Chánh Điện Lên TikTok
        env:
          TIKTOK_STREAM_KEY: ${{ secrets.TIKTOK_STREAM_KEY }}
          TIKTOK_RTMP_URL: ${{ secrets.TIKTOK_RTMP_URL }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          STREAM_DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '60' }}
        run: |
          chmod +x ./scripts/stream_runner.sh
          ./scripts/stream_runner.sh

      # CHỈ kích hoạt phiên tiếp theo khi:
      # 1. Phiên trước hoàn thành THÀNH CÔNG (tránh vòng lặp lỗi vô tận khi sai Key)
      # 2. Người dùng đã chọn auto_restart = 'true'
      - name: 🔄 Kích Hoạt Phiên Tiếp Theo (Có Kiểm Soát)
        if: success() && github.event.inputs.auto_restart == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Phiên stream đã hoàn thành thành công. Đang kích hoạt phiên kế tiếp..."
          gh workflow run stream.yml -f duration_minutes="${{ github.event.inputs.duration_minutes }}" -f auto_restart="true" || true
